<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalpa Shan playground</title>
    <meta name="description" content="Procedurally generated Chinese ink landscapes (山水) for your website. Pick a seed and get a painting." />
    <meta property="og:title" content="Kalpa Shan: ink landscapes for your website" />
    <meta property="og:description" content="Procedurally generated Chinese ink landscapes (山水). Seeded, animated, dependency-free SVG." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://barada02.github.io/kalpa-shan/" />
    <meta property="og:image" content="https://raw.githubusercontent.com/barada02/kalpa-shan/main/docs/preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <header class="top">
      <h1>Kalpa Shan <span class="zh">山水</span></h1>
      <nav class="nav">
        <a href="./" aria-current="page">Playground</a>
        <a href="./element.html">Web component</a>
        <a href="https://github.com/barada02/kalpa-shan">GitHub</a>
        <a href="https://www.npmjs.com/package/kalpa-shan">npm</a>
      </nav>
    </header>

    <main>
      <div class="stage-wrap">
        <div id="stage" class="stage" aria-live="polite"></div>
        <div id="headline" class="headline" hidden>
          <h2>Mountains &amp; Water</h2>
          <p>Your content lives in the painting's empty space.</p>
        </div>
      </div>

      <form id="controls" class="controls" autocomplete="off">
        <label class="field seed">
          <span>Seed</span>
          <div class="row">
            <input id="seed" name="seed" type="text" spellcheck="false" />
            <button type="button" id="shuffle" title="Random seed">Shuffle</button>
          </div>
        </label>

        <label class="field">
          <span>Palette</span>
          <select id="palette" name="palette"></select>
        </label>

        <label class="field">
          <span>Distance</span>
          <select id="distance" name="distance">
            <option value="auto">auto (by seed)</option>
            <option value="level">平远 level</option>
            <option value="high">高远 high</option>
            <option value="deep">深远 deep</option>
          </select>
        </label>

        <label class="field">
          <span>Space for text</span>
          <select id="space" name="space">
            <option value="none">none</option>
            <option value="left">left</option>
            <option value="right">right</option>
            <option value="center">center</option>
            <option value="top">top</option>
          </select>
        </label>

        <label class="field">
          <span>Season</span>
          <select id="season" name="season">
            <option value="summer">summer</option>
            <option value="spring">spring 春</option>
            <option value="autumn">autumn 秋</option>
            <option value="winter">winter 冬</option>
            <option value="auto">auto (today)</option>
          </select>
        </label>

        <label class="field">
          <span>Weather</span>
          <select id="weather" name="weather">
            <option value="clear">clear</option>
            <option value="rain">rain 雨</option>
            <option value="snow">snow 雪</option>
            <option value="fog">fog 雾</option>
          </select>
        </label>

        <label class="field">
          <span>Time</span>
          <select id="time" name="time">
            <option value="day">day</option>
            <option value="dusk">dusk 暮</option>
            <option value="night">night 夜</option>
            <option value="auto">auto (now)</option>
          </select>
        </label>

        <label class="field">
          <span>Seal 印章</span>
          <div class="row">
            <input id="seal" name="seal" type="text" maxlength="4" placeholder="e.g. 山水, KB" spellcheck="false" />
            <select id="sealStyle" name="sealStyle" title="Seal style">
              <option value="intaglio">白文</option>
              <option value="relief">朱文</option>
            </select>
          </div>
        </label>

        <label class="field">
          <span>Aspect</span>
          <select id="aspect" name="aspect">
            <option value="16 / 6">16:6 banner</option>
            <option value="16 / 9">16:9</option>
            <option value="4 / 3">4:3</option>
            <option value="1 / 1">1:1</option>
            <option value="9 / 16">9:16 phone</option>
          </select>
        </label>

        <label class="field">
          <span>Density <output id="densityOut"></output></span>
          <input id="density" name="density" type="range" min="0" max="1" step="0.05" value="0.6" />
        </label>

        <fieldset class="field toggles">
          <label><input id="trees" type="checkbox" checked /> Trees</label>
          <label><input id="water" type="checkbox" checked /> Water</label>
          <label><input id="grain" type="checkbox" checked /> Grain</label>
          <label><input id="showText" type="checkbox" checked /> Sample text</label>
          <label><input id="animate" type="checkbox" checked /> Animate</label>
        </fieldset>

        <div class="actions">
          <button type="button" id="replay">Replay</button>
          <button type="button" id="pause" aria-pressed="false">Pause</button>
          <button type="button" id="download">Download SVG</button>
          <button type="button" id="copy">Copy code</button>
        </div>
      </form>

      <pre class="code"><code id="code"></code></pre>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
